site_name: Recursos docentes de Rubén Guillem
site_description: Materiales de Matemáticas, Física y Química, Informática y Digitalización para Educación Secundaria y Bachillerato

theme:
  name: material
  language: es
  logo: assets/logo-colegio.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Rubén Guillem

nav:
  - Inicio: index.md

  - Física y Química:
      - Presentación: fisica-quimica/index.md
      - 1.º de Bachillerato:
          - Presentación: fisica-quimica/1-bach/index.md
          - Cinemática: fisica-quimica/1-bach/cinematica.md
          - Dinámica: fisica-quimica/1-bach/dinamica.md

  - Física — 2.º de Bachillerato:
      - Presentación: fisica/2-bach/index.md
      - Gravitación: fisica/2-bach/gravitacion.md
      - Vibraciones y ondas: fisica/2-bach/ondas.md

  - Matemáticas: matematicas/index.md
  - Informática I:
      - Presentación: informatica-1/index.md
      - Creación y publicación de portfolio: informatica-1/portfolio.md
  - Digitalización: digitalizacion/index.md
  - Actividades y proyectos: actividades/index.md
  - Biología:
      - Presentación: biologia/index.md
      - Biología: biologia/biologia/index.md
      - Herramientas básicas en biología: biologia/HBB/index.md
      - Árbol de la vida: biologia/arbol-de-la-vida/index.md
      - Biología Celular: biologia/biologia-celular/index.md
      - Geología:
          - Presentación: biologia/geologia/index.md
          - Práctica 1 — Minerales y rocas ígneas: biologia/geologia/practica-1.md
